services:
  aliyun-monitor:
    image: ghcr.io/ceozero/aliyun_monitor:latest
    container_name: aliyun-monitor
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # Set to "true" only when admin_users is configured in config.json.
      ENABLE_BOT: "false"
    volumes:
      - ./config:/opt/scripts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"     # 限制日志大小，防止撑爆磁盘
        max-file: "3"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true