services:
  aliyun-monitor:
    image: ghcr.io/ceozero/aliyun_monitor:latest
    container_name: aliyun-monitor
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      #只有在config中配置admin_users时才设置为"true"。json。
      ENABLE_BOT: "false"
    volumes:
      - ./config:/opt/scripts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"     # 限制日志大小，防止撑爆磁盘
        max-file: "3"
    networks:
      - 1panel-network

networks:
  1panel-network:
    external: true